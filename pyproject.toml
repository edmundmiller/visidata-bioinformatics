[project]
name = "vd-bioinformatics"
version = "0.1.0"
description = "VisiData plugins for bioinformatics file formats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "visidata>=2.8",
    "pybedlite>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=plugins"
testpaths = [
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["plugins"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
